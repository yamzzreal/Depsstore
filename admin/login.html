<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff1744"><title>Login Admin — DEPS STORE</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,500,0,0" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><style>
.auth-page{min-height:100vh;display:grid;place-items:center;padding:22px;position:relative;overflow:hidden;background:#060606}.auth-page:before,.auth-page:after{content:"";position:absolute;border-radius:50%;filter:blur(4px);pointer-events:none}.auth-page:before{width:430px;height:430px;top:-190px;left:-120px;background:radial-gradient(circle,rgba(255,23,68,.2),transparent 68%)}.auth-page:after{width:420px;height:420px;right:-160px;bottom:-200px;background:radial-gradient(circle,rgba(255,23,68,.13),transparent 68%)}.auth-card{width:min(430px,100%);position:relative;z-index:1;background:rgba(15,15,15,.92);border:1px solid #252525;border-radius:24px;padding:30px;box-shadow:0 30px 100px rgba(0,0,0,.6);backdrop-filter:blur(18px)}.auth-top{text-align:center}.auth-logo{width:58px;height:58px;margin:0 auto 16px;display:grid;place-items:center;border-radius:17px;background:#ff1744;box-shadow:0 0 40px rgba(255,23,68,.28)}.auth-logo span{font-size:31px}.auth-top h1{font-size:25px;margin:0 0 8px;letter-spacing:-.8px}.auth-top p{color:#777;font-size:11px;line-height:1.7;margin:0 auto 25px;max-width:290px}.auth-status{display:flex;align-items:center;gap:7px;width:max-content;margin:0 auto 18px;padding:7px 10px;border:1px solid #242424;border-radius:99px;color:#777;font-size:9px;font-weight:800;letter-spacing:.8px}.auth-status i{width:6px;height:6px;border-radius:50%;background:#35d07f;box-shadow:0 0 10px #35d07f}.auth-field{margin-bottom:13px}.auth-field label{display:block;color:#8a8a8a;font-size:9px;font-weight:800;letter-spacing:.7px;margin:0 0 7px}.auth-input{height:50px;display:flex;align-items:center;gap:10px;background:#0a0a0a;border:1px solid #292929;border-radius:12px;padding:0 13px;transition:.2s}.auth-input:focus-within{border-color:rgba(255,23,68,.6);box-shadow:0 0 0 3px rgba(255,23,68,.07)}.auth-input>span{color:#ff1744;font-size:20px}.auth-input input{width:100%;height:100%;background:transparent;border:0;outline:0;color:#fff;font:inherit;font-size:12px}.eye{border:0;background:transparent;color:#666;cursor:pointer;padding:4px;display:grid;place-items:center}.auth-error,.auth-success{display:none;padding:10px 12px;border-radius:10px;font-size:10px;line-height:1.5;margin-bottom:12px}.auth-error{background:#281016;border:1px solid #4b1b27;color:#ff7187}.auth-success{background:#0d2118;border:1px solid #19452f;color:#67d99b}.auth-btn{width:100%;height:48px;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:5px}.auth-btn.loading{opacity:.7;pointer-events:none}.auth-foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:17px;border-top:1px solid #1c1c1c;font-size:10px}.auth-foot a{color:#777}.auth-foot a:hover{color:#fff}.secure{display:flex;align-items:center;gap:5px;color:#555}.secure span{font-size:14px}@media(max-width:480px){.auth-card{padding:25px 20px;border-radius:20px}}
</style></head><body><main class="auth-page"><section class="auth-card"><div class="auth-top"><div class="auth-logo"><span class="material-symbols-outlined">bolt</span></div><div class="auth-status"><i></i> SECURE ADMIN ACCESS</div><h1>Selamat Datang, Admin</h1><p>Masuk ke dashboard DEPS STORE untuk mengelola produk, kategori, dan pengaturan toko.</p></div><div class="auth-error" id="error"></div><div class="auth-success" id="success"></div><form id="form" autocomplete="on"><div class="auth-field"><label>USERNAME ADMIN</label><div class="auth-input"><span class="material-symbols-outlined">person</span><input id="username" autocomplete="username" placeholder="Masukkan username" required></div></div><div class="auth-field"><label>PASSWORD</label><div class="auth-input"><span class="material-symbols-outlined">lock</span><input id="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required><button class="eye" id="toggle" type="button" aria-label="Tampilkan password"><span class="material-symbols-outlined">visibility</span></button></div></div><button class="btn auth-btn" id="login" type="submit"><span class="material-symbols-outlined">login</span><span>Masuk ke Dashboard</span></button></form><div class="auth-foot"><a href="../index.html">← Kembali ke store</a><span class="secure"><span class="material-symbols-outlined">shield_lock</span> Session aktif 8 jam</span></div></section></main><script type="module">
import {loginAdmin,isAdminSessionValid} from '../js/auth.js';
const form=document.querySelector('#form'),u=document.querySelector('#username'),p=document.querySelector('#password'),err=document.querySelector('#error'),ok=document.querySelector('#success'),btn=document.querySelector('#login');
if(await isAdminSessionValid()) location.replace('index.html');
if(new URLSearchParams(location.search).get('expired')){err.textContent='Sesi admin berakhir. Silakan login kembali.';err.style.display='block'}
document.querySelector('#toggle').onclick=()=>{p.type=p.type==='password'?'text':'password';document.querySelector('#toggle span').textContent=p.type==='password'?'visibility':'visibility_off'};
form.addEventListener('submit',async e=>{e.preventDefault();err.style.display='none';ok.style.display='none';btn.classList.add('loading');try{await loginAdmin(u.value.trim(),p.value);ok.textContent='Login berhasil. Mengarahkan ke dashboard...';ok.style.display='block';setTimeout(()=>location.replace('index.html'),350)}catch(ex){err.textContent=ex.message;err.style.display='block';btn.classList.remove('loading')}});
</script></body></html>
